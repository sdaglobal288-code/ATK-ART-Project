<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penilaian Tahunan</title>

<!-- Sesuaikan path ini dengan lokasi file init Supabase Anda yang sudah ada -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>

<style>
  :root{
    --bg: #241a12;
    --panel: #3a2b1e;
    --panel-2: #302213;
    --border: #4f3d29;
    --text: #f2e9dc;
    --text-muted: #b6a48c;
    --gold: #d4a24c;
    --teal: #4dd0c4;
    --orange: #e8873a;
    --pink: #e06b8b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 28px 20px 80px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }

  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .back{ color: var(--text-muted); text-decoration:none; font-size:13px; }
  .back:hover{ color: var(--gold); }
  h1{ font-size:22px; margin:4px 0 4px; }
  .muted{ color: var(--text-muted); font-size:13px; }

  .btn{
    background: linear-gradient(135deg, var(--gold), #c98a3a);
    color:#241a12; border:none; padding:11px 20px; border-radius:10px;
    font-weight:700; font-size:13px; cursor:pointer; text-decoration:none;
    display:inline-block; white-space:nowrap;
  }
  .btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.small{ padding:6px 12px; font-size:12px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:800px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
  }
  .stat-card .label{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .num{ font-size:26px; font-weight:700; margin-top:6px; }

  .filters{
    display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;
  }
  .filters input, .filters select{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13px; font-family:inherit;
  }
  .filters input{ flex:1; min-width:220px; }

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  table.list{ width:100%; border-collapse:collapse; }
  table.list th, table.list td{
    padding:12px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--border);
  }
  table.list th{ color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; background:var(--panel-2); }
  table.list tbody tr{ cursor:pointer; transition: background .12s; }
  table.list tbody tr:hover{ background: rgba(212,162,76,0.06); }
  table.list tbody tr:last-child td{ border-bottom:none; }

  .badge{
    display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .badge.draft{ background:rgba(182,164,140,0.15); color:var(--text-muted); }
  .badge.proses{ background:rgba(212,162,76,0.15); color:var(--gold); }
  .badge.selesai{ background:rgba(77,208,196,0.15); color:var(--teal); }

  .progress{ display:flex; align-items:center; gap:8px; }
  .progress-bar{ flex:1; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; min-width:60px; }
  .progress-bar > div{ height:100%; background:var(--teal); }
  .progress span{ font-size:11px; color:var(--text-muted); white-space:nowrap; }

  .empty{ padding:40px; text-align:center; color:var(--text-muted); font-size:13px; }

  /* Detail panel */
  tr.detail-row td{ padding:0; }
  .detail-panel{
    background:var(--panel-2); padding:20px 22px; border-top:1px dashed var(--border);
  }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:700px){ .detail-grid{ grid-template-columns:1fr; } }
  .detail-panel h3{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); margin:0 0 12px; }

  .info-line{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .info-line b{ color:var(--text); font-weight:600; }

  .approval-step{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border); gap:10px;
  }
  .approval-step:last-child{ border-bottom:none; }
  .approval-step .role{ font-size:12px; }
  .approval-step .role small{ display:block; color:var(--text-muted); font-size:11px; }
  .approval-step .action{ display:flex; align-items:center; gap:8px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; }
  .status-dot.pending{ background:var(--orange); }
  .status-dot.approved{ background:var(--teal); }
  .status-dot.expired{ background:var(--pink); }
  .copy-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text-muted);
    font-size:11px; padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  .copy-btn:hover{ color:var(--gold); border-color:var(--gold); }

  .loading{ padding:40px; text-align:center; color:var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <a class="back" href="pilih-modul.html">← Kembali ke pilih modul</a>
      <h1>Penilaian Tahunan</h1>
      <div class="muted">Daftar penilaian kinerja karyawan &amp; status approval</div>
    </div>
    <a class="btn" href="penilaian-form.html">+ Buat Penilaian Baru</a>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="label">Total Penilaian</div><div class="num" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">Draft</div><div class="num" id="statDraft">-</div></div>
    <div class="stat-card"><div class="label">Proses Approval</div><div class="num" id="statProses">-</div></div>
    <div class="stat-card"><div class="label">Selesai</div><div class="num" id="statSelesai">-</div></div>
  </div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Cari nama atau NIK karyawan...">
    <select id="periodeFilter"><option value="">Semua Periode</option></select>
    <select id="statusFilter">
      <option value="">Semua Status</option>
      <option value="Draft">Draft</option>
      <option value="Proses">Proses</option>
      <option value="Selesai">Selesai</option>
    </select>
    <select id="tipeFilter">
      <option value="">Semua Tipe Form</option>
      <option value="C">Form C</option>
      <option value="B">Form B</option>
      <option value="WORKER">Form Worker</option>
    </select>
  </div>

  <div class="card">
    <table class="list" id="listTable">
      <thead>
        <tr>
          <th>Nama Karyawan</th>
          <th>Tipe Form</th>
          <th>Periode</th>
          <th>Status</th>
          <th>Progres Approval</th>
          <th>Total Rata-rata</th>
          <th>Dibuat</th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="7"><div class="loading">Memuat data...</div></td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const FORM_LABELS = { C: 'Form C', B: 'Form B', WORKER: 'Form Worker' };
const APPROVAL_LABELS = {
  C: ['Atasan Langsung','Atasan satu tingkat diatas atasan langsung','Atasan Dua tingkat diatas atasan langsung','HCS Unit'],
  B: ['SPV','Atasan langsung SPV','Atasan tidak langsung SPV','HCS Unit'],
  WORKER: ['SPV','Atasan langsung SPV','Atasan Tidak langsung SPV','HCS Unit']
};

let penilaianList = [];
let approvalByPenilaian = {};

const currentUser = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!currentUser) window.location.href = 'login.html';

async function loadData() {
  const { data: penilaian, error: err1 } = await supabaseClient
    .from('penilaian_karyawan')
    .select('*')
    .order('created_at', { ascending: false });

  if (err1) { console.error(err1); document.getElementById('listBody').innerHTML = `<tr><td colspan="7"><div class="empty">Gagal memuat data.</div></td></tr>`; return; }

  const { data: approvals, error: err2 } = await supabaseClient
    .from('penilaian_approval')
    .select('*, approver:master_karyawan(nama)')
    .order('urutan', { ascending: true });

  if (err2) console.error(err2);

  penilaianList = penilaian || [];
  approvalByPenilaian = {};
  (approvals || []).forEach(a => {
    if (!approvalByPenilaian[a.penilaian_id]) approvalByPenilaian[a.penilaian_id] = [];
    approvalByPenilaian[a.penilaian_id].push(a);
  });

  populatePeriodeFilter();
  renderStats();
  renderTable();
}

function populatePeriodeFilter() {
  const periods = [...new Set(penilaianList.map(p => p.periode))].sort().reverse();
  const sel = document.getElementById('periodeFilter');
  periods.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}

function renderStats() {
  document.getElementById('statTotal').textContent = penilaianList.length;
  document.getElementById('statDraft').textContent = penilaianList.filter(p => p.status === 'Draft').length;
  document.getElementById('statProses').textContent = penilaianList.filter(p => p.status === 'Proses').length;
  document.getElementById('statSelesai').textContent = penilaianList.filter(p => p.status === 'Selesai').length;
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const periode = document.getElementById('periodeFilter').value;
  const status = document.getElementById('statusFilter').value;
  const tipe = document.getElementById('tipeFilter').value;

  return penilaianList.filter(p => {
    if (search && !(`${p.nama_snapshot} ${p.nik_snapshot}`.toLowerCase().includes(search))) return false;
    if (periode && p.periode !== periode) return false;
    if (status && p.status !== status) return false;
    if (tipe && p.tipe_form !== tipe) return false;
    return true;
  });
}

function badgeClass(status) {
  if (status === 'Draft') return 'draft';
  if (status === 'Proses') return 'proses';
  if (status === 'Selesai') return 'selesai';
  return 'draft';
}

function renderTable() {
  const body = document.getElementById('listBody');
  const filtered = getFiltered();

  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty">Belum ada data penilaian yang cocok.</div></td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(p => {
    const steps = (approvalByPenilaian[p.id] || []);
    const approvedCount = steps.filter(s => s.status === 'approved').length;
    const pct = steps.length ? Math.round((approvedCount / steps.length) * 100) : 0;
    const tanggal = new Date(p.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });

    return `
      <tr class="main-row" data-id="${p.id}">
        <td><b>${p.nama_snapshot || '-'}</b><br><span class="muted">${p.nik_snapshot || ''}</span></td>
        <td>${FORM_LABELS[p.tipe_form] || p.tipe_form}</td>
        <td>${p.periode}</td>
        <td><span class="badge ${badgeClass(p.status)}">${p.status}</span></td>
        <td>
          <div class="progress">
            <div class="progress-bar"><div style="width:${pct}%"></div></div>
            <span>${approvedCount}/${steps.length || 4}</span>
          </div>
        </td>
        <td>${p.total_rata_rata != null ? Number(p.total_rata_rata).toFixed(2) : '-'}</td>
        <td>${tanggal}</td>
      </tr>
      <tr class="detail-row hidden" data-detail-for="${p.id}">
        <td colspan="7"><div class="detail-panel">${renderDetailPanel(p, steps)}</div></td>
      </tr>
    `;
  }).join('');

  body.querySelectorAll('.main-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      const detailRow = body.querySelector(`.detail-row[data-detail-for="${id}"]`);
      detailRow.classList.toggle('hidden');
    });
  });

  body.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(btn.dataset.link).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Tersalin!';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    });
  });
}

function renderDetailPanel(p, steps) {
  const labels = APPROVAL_LABELS[p.tipe_form] || APPROVAL_LABELS.B;
  const baseUrl = `${window.location.origin}${window.location.pathname.replace('penilaian.html','')}approval.html`;

  const infoHtml = `
    <div>
      <h3>Informasi Karyawan</h3>
      <div class="info-line"><b>${p.nama_snapshot || '-'}</b></div>
      <div class="info-line">NIK: ${p.nik_snapshot || '-'}</div>
      <div class="info-line">Jabatan: ${p.jabatan_snapshot || '-'} ${p.level_snapshot ? '('+p.level_snapshot+')' : ''}</div>
      <div class="info-line">Departemen: ${p.departemen_snapshot || '-'} ${p.sub_departemen_snapshot ? '/ '+p.sub_departemen_snapshot : ''}</div>
      <div class="info-line">Unit: ${p.unit_snapshot || '-'}</div>
      <div class="info-line">Dibuat oleh: ${p.dibuat_oleh || '-'}</div>
      ${p.saran_kekuatan ? `<div class="info-line" style="margin-top:10px;"><b>Kekuatan</b><br>${escapeHtml(p.saran_kekuatan)}</div>` : ''}
      ${p.saran_pengembangan ? `<div class="info-line"><b>Area pengembangan</b><br>${escapeHtml(p.saran_pengembangan)}</div>` : ''}
      ${p.catatan_atasan ? `<div class="info-line"><b>Catatan atasan</b><br>${escapeHtml(p.catatan_atasan)}</div>` : ''}
    </div>
  `;

  const stepsHtml = steps.map((s, i) => {
    const label = labels[i] || s.tahap;
    const isExpired = s.status === 'pending' && s.expires_at && new Date(s.expires_at) < new Date();
    const statusKey = isExpired ? 'expired' : s.status;
    const statusText = isExpired ? 'Kedaluwarsa' : (s.status === 'approved' ? 'Sudah TTD' : 'Menunggu');
    const link = `${baseUrl}?token=${s.token}`;
    return `
      <div class="approval-step">
        <div class="role">
          ${label}
          <small>${s.approver?.nama || '-'}${s.signed_at ? ' · ' + new Date(s.signed_at).toLocaleDateString('id-ID') : ''}</small>
        </div>
        <div class="action">
          <span class="status-dot ${statusKey}"></span>
          <span class="muted">${statusText}</span>
          ${s.status !== 'approved' ? `<button class="copy-btn" data-link="${link}">Salin Link</button>` : ''}
        </div>
      </div>
    `;
  }).join('') || '<div class="muted">Belum ada data approval.</div>';

  return `
    <div class="detail-grid">
      ${infoHtml}
      <div>
        <h3>Progres Tanda Tangan</h3>
        ${stepsHtml}
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

['searchInput','periodeFilter','statusFilter','tipeFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
  document.getElementById(id).addEventListener('change', renderTable);
});

loadData();
</script>
</body>
</html>
