<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Penilaian Tahunan</title>

<!-- Sesuaikan path ini dengan lokasi file init Supabase Anda yang sudah ada -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<script src="js/modul-popup.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="js/penilaian-export.js"></script>

<style>
  :root{
    --bg: #241a12;
    --panel: #3a2b1e;
    --panel-2: #302213;
    --border: #4f3d29;
    --text: #f2e9dc;
    --text-muted: #b6a48c;
    --gold: #d4a24c;
    --teal: #4dd0c4;
    --orange: #e8873a;
    --pink: #e06b8b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 28px 20px 80px;
  }
  .wrap{ max-width:1100px; margin:0 auto; }

  .topbar{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .back{ color: var(--text-muted); text-decoration:none; font-size:13px; }
  .back:hover{ color: var(--gold); }
  h1{ font-size:22px; margin:4px 0 4px; }
  .muted{ color: var(--text-muted); font-size:13px; }

  .btn{
    background: linear-gradient(135deg, var(--gold), #c98a3a);
    color:#241a12; border:none; padding:11px 20px; border-radius:10px;
    font-weight:700; font-size:13px; cursor:pointer; text-decoration:none;
    display:inline-block; white-space:nowrap;
  }
  .btn.secondary{ background:transparent; border:1px solid var(--border); color:var(--text); }
  .btn.small{ padding:6px 12px; font-size:12px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:800px){ .stats{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px;
  }
  .stat-card .label{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; }
  .stat-card .num{ font-size:26px; font-weight:700; margin-top:6px; }

  .filters{
    display:flex; gap:12px; flex-wrap:wrap; margin-bottom:18px;
  }
  .filters input, .filters select{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:8px; font-size:13px; font-family:inherit;
  }
  .filters input{ flex:1; min-width:220px; }

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; overflow:hidden;
  }
  table.list{ width:100%; border-collapse:collapse; }
  table.list th, table.list td{
    padding:12px 14px; text-align:left; font-size:13px; border-bottom:1px solid var(--border);
  }
  table.list th{ color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; background:var(--panel-2); }
  table.list tbody tr{ cursor:pointer; transition: background .12s; }
  table.list tbody tr:hover{ background: rgba(212,162,76,0.06); }
  table.list tbody tr:last-child td{ border-bottom:none; }

  .badge{
    display:inline-block; padding:4px 10px; border-radius:20px; font-size:11px; font-weight:700;
  }
  .badge.draft{ background:rgba(182,164,140,0.15); color:var(--text-muted); }
  .badge.proses{ background:rgba(212,162,76,0.15); color:var(--gold); }
  .badge.selesai{ background:rgba(77,208,196,0.15); color:var(--teal); }

  .progress{ display:flex; align-items:center; gap:8px; }
  .progress-bar{ flex:1; height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; min-width:60px; }
  .progress-bar > div{ height:100%; background:var(--teal); }
  .progress span{ font-size:11px; color:var(--text-muted); white-space:nowrap; }

  .empty{ padding:40px; text-align:center; color:var(--text-muted); font-size:13px; }

  /* Detail panel */
  tr.detail-row.hidden{ display:none; }
  tr.detail-row td{ padding:0; }
  .detail-panel{
    background:var(--panel-2); padding:20px 22px; border-top:1px dashed var(--border);
  }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:700px){ .detail-grid{ grid-template-columns:1fr; } }
  .detail-panel h3{ font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); margin:0 0 12px; }

  .info-line{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .info-line b{ color:var(--text); font-weight:600; }

  .approval-step{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border); gap:10px;
  }
  .approval-step:last-child{ border-bottom:none; }
  .approval-step .role{ font-size:12px; }
  .approval-step .role small{ display:block; color:var(--text-muted); font-size:11px; }
  .approval-step .action{ display:flex; align-items:center; gap:8px; }
  .status-dot{ width:8px; height:8px; border-radius:50%; }
  .status-dot.pending{ background:var(--orange); }
  .status-dot.approved{ background:var(--teal); }
  .status-dot.expired{ background:var(--pink); }
  .copy-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text-muted);
    font-size:11px; padding:5px 10px; border-radius:6px; cursor:pointer;
  }
  .copy-btn:hover{ color:var(--gold); border-color:var(--gold); }
  .cetak-btn{ background:transparent; border:1px solid var(--border); color:var(--text-muted); padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; }
  .cetak-btn:hover{ color:var(--gold); border-color:var(--gold); }

  .btn:disabled{ opacity:.55; cursor:wait; }
  .btn-hapus{ color:var(--pink); border-color:var(--pink); }
  .btn-hapus:hover{ background:rgba(255,100,130,.12); }
  .exp-msg{ font-size:12px; margin:-8px 0 14px; min-height:16px; }
  .exp-msg.err{ color:var(--pink); } .exp-msg.ok{ color:var(--teal); }
  .prog-row{ display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); gap:10px; font-size:12px; }
  .prog-row:last-child{ border-bottom:none; }
  .prog-row small{ display:block; color:var(--text-muted); font-size:11px; }
  .loading{ padding:40px; text-align:center; color:var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <a class="back" href="pilih-modul.html">← Kembali ke pilih modul</a>
      <h1>Penilaian Tahunan</h1>
      <div class="muted">Daftar penilaian kinerja karyawan &amp; progres pengisian nilai</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn secondary" id="btnExport" type="button">⬇ Tarik Excel</button>
      <a class="btn" href="penilaian-form.html">+ Buat Penilaian Baru</a>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="label">Total Penilaian</div><div class="num" id="statTotal">-</div></div>
    <div class="stat-card"><div class="label">Belum Dinilai</div><div class="num" id="statDraft">-</div></div>
    <div class="stat-card"><div class="label">Proses Penilaian</div><div class="num" id="statProses">-</div></div>
    <div class="stat-card"><div class="label">Selesai</div><div class="num" id="statSelesai">-</div></div>
  </div>

  <div class="filters">
    <input type="text" id="searchInput" placeholder="Cari nama atau NIK karyawan...">
    <select id="periodeFilter"><option value="">Semua Periode</option></select>
    <select id="statusFilter">
      <option value="">Semua Status</option>
      <option value="Draft">Belum Dinilai</option>
      <option value="Proses">Proses Penilaian</option>
      <option value="Selesai">Selesai</option>
    </select>
    <select id="tipeFilter">
      <option value="">Semua Tipe Form</option>
      <option value="C">Form C</option>
      <option value="B">Form B</option>
      <option value="WORKER">Form A</option>
    </select>
  </div>

  <div class="exp-msg" id="expMsg"></div>

  <div class="card">
    <table class="list" id="listTable">
      <thead>
        <tr>
          <th>Nama Karyawan</th>
          <th>Tipe Form</th>
          <th>Periode</th>
          <th>Status Penilaian</th>
          <th>Progres Penilaian</th>
          <th>Total Rata-rata</th>
          <th>Dibuat</th>
        </tr>
      </thead>
      <tbody id="listBody">
        <tr><td colspan="7"><div class="loading">Memuat data...</div></td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const FORM_LABELS = { C: 'Form C', B: 'Form B', WORKER: 'Form A' };
// Jumlah kriteria per bagian pada tiap tipe form (harus sama dengan template di penilaian-nilai.html)
const SECTIONS = {
  C: [['I - Sikap', 5], ['II - Penguasaan Pekerjaan', 2], ['III - People Management', 4]],
  B: [['I - Sikap', 5], ['II - Penguasaan Pekerjaan', 2]],
  WORKER: [['Penilaian Kinerja', 5]]
};
const totalKriteria = tipe => (SECTIONS[tipe] || SECTIONS.B).reduce((a, s) => a + s[1], 0);
const STATUS_LABEL = { Draft: 'Belum Dinilai', Proses: 'Proses', Selesai: 'Selesai' };

let penilaianList = [];
let allRows = [];        // semua baris penilaian_karyawan (tanpa pengelompokan batch)
let allDetails = [];     // semua baris penilaian_detail
let detailByPenilaian = {};

const currentUser = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!currentUser) window.location.href = 'login.html';

// Supabase membatasi 1000 baris per permintaan, jadi diambil bertahap
async function fetchAll(table, select, orderCol, mod) {
  const out = [], size = 1000;
  for (let from = 0; ; from += size) {
    let q = supabaseClient.from(table).select(select);
    if (mod) q = mod(q);
    q = q.range(from, from + size - 1);
    if (orderCol) q = q.order(orderCol, { ascending: false });
    const { data, error } = await q;
    if (error) return { data: null, error };
    out.push(...(data || []));
    if (!data || data.length < size) break;
  }
  return { data: out, error: null };
}

// Progres penilaian = jumlah skor yang sudah terisi dibanding jumlah kriteria
function progressOf(rows) {
  let filled = 0, total = 0;
  rows.forEach(r => {
    const t = totalKriteria(r.tipe_form);
    const f = (detailByPenilaian[r.id] || []).filter(d => d.skor != null).length;
    filled += Math.min(f, t); total += t;
  });
  return { filled, total, pct: total ? Math.round(filled / total * 100) : 0 };
}
function statusOf(p) {
  const pr = progressOf(p._members || [p]);
  p._prog = pr;
  if (pr.filled === 0) return 'Draft';
  return pr.filled >= pr.total ? 'Selesai' : 'Proses';
}

async function loadData() {
  const [r1, r2] = await Promise.all([
    fetchAll('penilaian_karyawan', '*', 'created_at'),
    fetchAll('penilaian_detail', 'penilaian_id,kategori,kode,skor', 'id')
  ]);

  if (r1.error) { console.error(r1.error); document.getElementById('listBody').innerHTML = `<tr><td colspan="7"><div class="empty">Gagal memuat data.</div></td></tr>`; return; }
  if (r2.error) console.error(r2.error);

  allRows = r1.data || [];
  allDetails = r2.data || [];
  detailByPenilaian = {};
  allDetails.forEach(d => { (detailByPenilaian[d.penilaian_id] = detailByPenilaian[d.penilaian_id] || []).push(d); });

  // Form A: beberapa karyawan dalam satu form (batch_id sama) ditampilkan sebagai satu baris.
  const asc = [...allRows].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  const batches = {}, singles = [];
  asc.forEach(r => {
    if (r.batch_id) {
      if (!batches[r.batch_id]) { batches[r.batch_id] = { ...r, _members: [] }; singles.push(batches[r.batch_id]); }
      batches[r.batch_id]._members.push(r);
    } else singles.push(r);
  });
  penilaianList = singles.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  // Status mengikuti progres pengisian nilai (approval masih manual, jadi tidak dipakai di sini)
  penilaianList.forEach(p => { p._status = statusOf(p); });

  populatePeriodeFilter();
  renderStats();
  renderTable();
  updateExportLabel();
  cekPengingat();
}

// Popup pengingat: penilaian yang nilainya belum lengkap
function cekPengingat() {
  const items = penilaianList.filter(p => p._status !== 'Selesai').map(p => ({
    judul: p._members ? p._members.length + ' karyawan (' + p._members.slice(0, 2).map(m => m.nama_snapshot).join(', ') + (p._members.length > 2 ? ', ...' : '') + ')' : (p.nama_snapshot || '-'),
    sub: (FORM_LABELS[p.tipe_form] || p.tipe_form) + ' · periode ' + p.periode,
    kanan: p._prog.filled + '/' + p._prog.total + ' nilai', lewat: p._status === 'Draft'
  }));
  if (!items.length) return;
  tampilPopupModul({ judul: items.length + ' Penilaian Belum Lengkap', sub: 'Penilaian ini nilainya belum terisi lengkap. Segera lengkapi lewat Input / Edit Nilai.', items });
}

function populatePeriodeFilter() {
  const periods = [...new Set(penilaianList.map(p => p.periode))].sort().reverse();
  const sel = document.getElementById('periodeFilter');
  periods.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    sel.appendChild(opt);
  });
}

function renderStats() {
  document.getElementById('statTotal').textContent = penilaianList.length;
  document.getElementById('statDraft').textContent = penilaianList.filter(p => p._status === 'Draft').length;
  document.getElementById('statProses').textContent = penilaianList.filter(p => p._status === 'Proses').length;
  document.getElementById('statSelesai').textContent = penilaianList.filter(p => p._status === 'Selesai').length;
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.trim().toLowerCase();
  const periode = document.getElementById('periodeFilter').value;
  const status = document.getElementById('statusFilter').value;
  const tipe = document.getElementById('tipeFilter').value;

  return penilaianList.filter(p => {
    const hay = p._members ? p._members.map(m => `${m.nama_snapshot} ${m.nik_snapshot}`).join(' ') : `${p.nama_snapshot} ${p.nik_snapshot}`;
    if (search && !hay.toLowerCase().includes(search)) return false;
    if (periode && p.periode !== periode) return false;
    if (status && p._status !== status) return false;
    if (tipe && p.tipe_form !== tipe) return false;
    return true;
  });
}

function badgeClass(status) {
  if (status === 'Draft') return 'draft';
  if (status === 'Proses') return 'proses';
  if (status === 'Selesai') return 'selesai';
  return 'draft';
}

function renderTable() {
  const body = document.getElementById('listBody');
  const filtered = getFiltered();

  if (!filtered.length) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty">Belum ada data penilaian yang cocok.</div></td></tr>`;
    return;
  }

  body.innerHTML = filtered.map(p => {
    const pr = p._prog;
    const tanggal = new Date(p.created_at).toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });

    return `
      <tr class="main-row" data-id="${p.id}">
        <td>${p._members ? `<b>${p._members.length} karyawan</b><br><span class="muted">${p._members.slice(0,2).map(m => escapeHtml(m.nama_snapshot)).join(', ')}${p._members.length > 2 ? ', ...' : ''}</span>` : `<b>${escapeHtml(p.nama_snapshot || '-')}</b><br><span class="muted">${escapeHtml(p.nik_snapshot || '')}</span>`}</td>
        <td>${FORM_LABELS[p.tipe_form] || p.tipe_form}</td>
        <td>${p.periode}</td>
        <td><span class="badge ${badgeClass(p._status)}">${STATUS_LABEL[p._status]}</span></td>
        <td>
          <div class="progress">
            <div class="progress-bar"><div style="width:${pr.pct}%"></div></div>
            <span>${pr.filled}/${pr.total}</span>
          </div>
        </td>
        <td>${!p._members && p.total_rata_rata != null ? Number(p.total_rata_rata).toFixed(2) : '-'}</td>
        <td>${tanggal}</td>
      </tr>
      <tr class="detail-row hidden" data-detail-for="${p.id}">
        <td colspan="7"><div class="detail-panel">${renderDetailPanel(p)}</div></td>
      </tr>
    `;
  }).join('');

  body.querySelectorAll('.main-row').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.id;
      const detailRow = body.querySelector(`.detail-row[data-detail-for="${id}"]`);
      detailRow.classList.toggle('hidden');
    });
  });
}

function renderDetailPanel(p) {

  const infoHtml = p._members ? `
    <div>
      <h3>Karyawan yang Dinilai (${p._members.length})</h3>
      ${p._members.map((m, i) => `<div class="info-line">${i + 1}. <b>${escapeHtml(m.nama_snapshot || '-')}</b> · ${escapeHtml(m.nik_snapshot || '')}<br>&nbsp;&nbsp;&nbsp;${escapeHtml(m.jabatan_snapshot || '-')} · ${escapeHtml(m.departemen_snapshot || '-')}${m.sub_departemen_snapshot ? ' / ' + escapeHtml(m.sub_departemen_snapshot) : ''}</div>`).join('')}
      <div class="info-line" style="margin-top:6px;">Dibuat oleh: ${escapeHtml(p.dibuat_oleh || '-')}</div>
      <div style="margin-top:10px;"><a class="cetak-btn" style="text-decoration:none;display:inline-block;" href="penilaian-cetak.html?id=${p.id}" onclick="event.stopPropagation()">🖨 Cetak Form</a> <a class="cetak-btn" style="text-decoration:none;display:inline-block;" href="penilaian-nilai.html?id=${p.id}" onclick="event.stopPropagation()">✏️ Input / Edit Nilai</a> <button type="button" class="cetak-btn btn-hapus" onclick="event.stopPropagation(); hapusPenilaian('${p.id}')">🗑 Hapus</button></div>
    </div>
  ` : `
    <div>
      <h3>Informasi Karyawan</h3>
      <div class="info-line"><b>${p.nama_snapshot || '-'}</b></div>
      <div class="info-line">NIK: ${p.nik_snapshot || '-'}</div>
      <div class="info-line">Jabatan: ${p.jabatan_snapshot || '-'} ${p.level_snapshot ? '('+p.level_snapshot+')' : ''}</div>
      <div class="info-line">Departemen: ${p.departemen_snapshot || '-'} ${p.sub_departemen_snapshot ? '/ '+p.sub_departemen_snapshot : ''}</div>
      <div class="info-line">Unit: ${p.unit_snapshot || '-'}</div>
      <div class="info-line">Dibuat oleh: ${p.dibuat_oleh || '-'}</div>
      <div style="margin-top:10px;"><a class="cetak-btn" style="text-decoration:none;display:inline-block;" href="penilaian-cetak.html?id=${p.id}" onclick="event.stopPropagation()">🖨 Cetak Form</a> <a class="cetak-btn" style="text-decoration:none;display:inline-block;" href="penilaian-nilai.html?id=${p.id}" onclick="event.stopPropagation()">✏️ Input / Edit Nilai</a> <button type="button" class="cetak-btn btn-hapus" onclick="event.stopPropagation(); hapusPenilaian('${p.id}')">🗑 Hapus</button></div>
      ${p.saran_kekuatan ? `<div class="info-line" style="margin-top:10px;"><b>Kekuatan</b><br>${escapeHtml(p.saran_kekuatan)}</div>` : ''}
      ${p.saran_pengembangan ? `<div class="info-line"><b>Area pengembangan</b><br>${escapeHtml(p.saran_pengembangan)}</div>` : ''}
      ${p.catatan_atasan ? `<div class="info-line"><b>Catatan atasan</b><br>${escapeHtml(p.catatan_atasan)}</div>` : ''}
    </div>
  `;

  // Progres penilaian: per karyawan (Form A) atau per bagian kriteria (Form B / C)
  let progHtml;
  if (p._members) {
    progHtml = p._members.map(m => {
      const pr = progressOf([m]);
      const skor = (detailByPenilaian[m.id] || []).filter(d => d.skor != null).map(d => Number(d.skor));
      const rata = skor.length ? (skor.reduce((x, y) => x + y, 0) / skor.length).toFixed(2) : '-';
      return `<div class="prog-row"><div>${escapeHtml(m.nama_snapshot || '-')}<small>Rata-rata: ${rata}</small></div><div class="progress" style="min-width:150px;"><div class="progress-bar"><div style="width:${pr.pct}%"></div></div><span>${pr.filled}/${pr.total}</span></div></div>`;
    }).join('');
  } else {
    progHtml = (SECTIONS[p.tipe_form] || SECTIONS.B).map(([kat, total]) => {
      const det = (detailByPenilaian[p.id] || []).filter(d => String(d.kategori).trim() === kat && d.skor != null);
      const avg = det.length ? (det.reduce((x, d) => x + Number(d.skor), 0) / det.length).toFixed(2) : '-';
      const pct = Math.round(Math.min(det.length, total) / total * 100);
      return `<div class="prog-row"><div>${escapeHtml(kat)}<small>Rata-rata: ${avg}</small></div><div class="progress" style="min-width:150px;"><div class="progress-bar"><div style="width:${pct}%"></div></div><span>${Math.min(det.length, total)}/${total}</span></div></div>`;
    }).join('');
  }

  return `
    <div class="detail-grid">
      ${infoHtml}
      <div>
        <h3>Progres Penilaian</h3>
        ${progHtml}
        <div class="info-line" style="margin-top:10px;">Approval / tanda tangan dilakukan manual pada form cetak.</div>
      </div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

['searchInput','periodeFilter','statusFilter','tipeFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderTable);
  document.getElementById(id).addEventListener('change', renderTable);
});

// =====================================================
// TARIK EXCEL (format template REKAP_PENILAIAN_TAHUN_xxxx)
// =====================================================
function periodeExport() {
  const sel = document.getElementById('periodeFilter').value;
  if (sel) return sel;
  const ps = [...new Set(allRows.map(r => r.periode))].sort().reverse();
  return ps[0] || String(new Date().getFullYear());
}
function updateExportLabel() {
  document.getElementById('btnExport').textContent = '⬇ Tarik Excel (' + periodeExport() + ')';
}
document.getElementById('periodeFilter').addEventListener('change', updateExportLabel);

document.getElementById('btnExport').addEventListener('click', async () => {
  const btn = document.getElementById('btnExport'), msg = document.getElementById('expMsg');
  const periode = periodeExport();
  msg.className = 'exp-msg'; msg.textContent = '';
  btn.disabled = true; btn.textContent = 'Menyiapkan Excel...';
  try {
    const rows = allRows.filter(r => String(r.periode) === String(periode));
    if (!rows.length) throw new Error('Belum ada data penilaian untuk periode ' + periode + '.');
    const resp = await fetch('templates/REKAP_PENILAIAN_TEMPLATE.xlsx', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('Template Excel tidak ditemukan (templates/REKAP_PENILAIAN_TEMPLATE.xlsx).');
    const tpl = await resp.arrayBuffer();
    const ids = new Set(rows.map(r => r.id));

    // Tanggal masuk kerja otomatis dari Master Karyawan
    const kr = await fetchAll('master_karyawan', 'id,nik,tanggal_masuk', 'id');
    if (kr.error) console.error(kr.error);
    const kar = { byId: {}, byNik: {} };
    (kr.data || []).forEach(k => { kar.byId[k.id] = k; if (k.nik) kar.byNik[String(k.nik).trim()] = k; });

    // Kedisiplinan otomatis dari Dashboard Analitik HR (hr_absensi) pada periode tsb
    const ab = await fetchAll('hr_absensi', 'nik,tanggal,status,kode,kategori', 'id',
      q => q.gte('tanggal', periode + '-01-01').lte('tanggal', periode + '-12-31'));
    if (ab.error) console.error(ab.error);
    const { wb, jumlahWorker, jumlahStaff } = await buildRekapWorkbook(ExcelJS, tpl, periode, rows, allDetails.filter(d => ids.has(d.penilaian_id)), { karyawan: kar, absensi: ab.data || [] });
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'REKAP_PENILAIAN_TAHUN_' + periode + '.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    msg.className = 'exp-msg ok';
    msg.textContent = 'Excel periode ' + periode + ' berhasil diunduh (' + jumlahWorker + ' karyawan Form A, ' + jumlahStaff + ' karyawan Form B/C).'
      + (ab.error ? ' Kolom Kedisiplinan kosong karena data absensi gagal dimuat.' : (ab.data && ab.data.length ? '' : ' Belum ada data absensi periode ini, kolom Kedisiplinan dikosongkan.'));
  } catch (err) {
    console.error(err);
    msg.className = 'exp-msg err';
    msg.textContent = 'Gagal membuat Excel: ' + (err.message || 'terjadi kesalahan.');
  }
  btn.disabled = false; updateExportLabel();
});

// Hapus penilaian (Form A batch = semua karyawan dalam form itu) beserta nilai & approval-nya
async function hapusPenilaian(id) {
  const p = penilaianList.find(x => String(x.id) === String(id));
  if (!p) return;
  const members = p._members || [p];
  const nama = p._members ? members.length + ' karyawan (' + members.map(m => m.nama_snapshot).join(', ') + ')' : (p.nama_snapshot || '-');
  if (!confirm('Hapus penilaian ' + (FORM_LABELS[p.tipe_form] || p.tipe_form) + ' periode ' + p.periode + ' untuk ' + nama + '?\n\nSemua nilai ikut terhapus dan tidak bisa dikembalikan.')) return;
  const ids = members.map(m => m.id);
  const msg = document.getElementById('expMsg');
  try {
    let r = await supabaseClient.from('penilaian_approval').delete().in('penilaian_id', ids); if (r.error) throw r.error;
    r = await supabaseClient.from('penilaian_detail').delete().in('penilaian_id', ids); if (r.error) throw r.error;
    r = await supabaseClient.from('penilaian_karyawan').delete().in('id', ids); if (r.error) throw r.error;
    msg.className = 'exp-msg ok'; msg.textContent = 'Penilaian ' + nama + ' berhasil dihapus.';
    await loadData();
  } catch (err) {
    console.error(err);
    msg.className = 'exp-msg err'; msg.textContent = 'Gagal menghapus: ' + (err.message || 'terjadi kesalahan.');
  }
}

loadData();
</script>
