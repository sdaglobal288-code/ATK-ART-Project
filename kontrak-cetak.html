<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Internal Memo Perpanjangan Kontrak</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>

<style>
  :root{
    --bg:#241a12; --panel:#3a2b1e; --border:#4f3d29; --text:#f2e9dc; --text-muted:#b6a48c; --pink:#e06b8b;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; color:var(--text); padding:24px 16px 80px; }

  .toolbar{ max-width:800px; margin:0 auto 18px; display:flex; justify-content:space-between; align-items:center; }
  .back{ color:var(--text-muted); text-decoration:none; font-size:13px; }
  .btn{ background:linear-gradient(135deg, var(--pink), #c14e70); color:#241a12; border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }

  .sheet{
    background:#fff; color:#111; max-width:800px; margin:0 auto 24px; padding:0 46px 40px;
    font-family: 'Times New Roman', Times, serif; font-size:13px; line-height:1.55;
    border-radius:4px; box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .letterhead{ display:flex; align-items:center; gap:14px; padding-bottom:0; margin-bottom:0; }
  .logo-mark{ width:240px; height:100px; overflow:hidden; position:relative; margin-bottom:4px; }
  .logo-mark img{ position:absolute; top:0; left:0; width:240px; height:150px; object-fit:contain; }

  .memo-title{ text-align:left; font-weight:700; letter-spacing:1px; margin:2px 0 0; font-size:14px; font-family:'Times New Roman', Times, serif; text-decoration:underline; display:inline-block; position:relative; }
  .memo-number{ text-align:left; font-size:12px; color:#333; margin:0 0 8px; font-family:'Times New Roman', Times, serif; }

  .memo-meta{ margin-bottom:10px; }
  .memo-meta table{ border-collapse:collapse; }
  .memo-meta td{ padding:2px 6px 2px 0; vertical-align:top; font-size:13px; }
  .memo-meta td.k{ width:80px; }
  .colon-space{ display:inline-block; width:14px; }

  .memo-body p{ margin:0 0 12px; text-align:justify; }

  table.info-table{ width:100%; border-collapse:collapse; margin:14px 0 14px; font-size:12px; table-layout:fixed; }
  table.info-table th, table.info-table td{ border:none; padding:3px 8px 3px 0; text-align:left; font-weight:normal; vertical-align:top; }
  table.info-table th{ width:35%; }
  table.info-table th::after{ content:":"; float:right; }
  table.info-table .blank-line{ display:inline-block; width:240px; border-bottom:1px solid #333; height:14px; }

  .rekom-list{ margin:14px 0; }
  .rekom-list .item{ margin-bottom:4px; }
  .checkbox{ display:inline-block; width:12px; height:12px; border:1px solid #333; margin-right:6px; vertical-align:middle; position:relative; top:-1px; }
  .checkbox.checked{ background:#1b3a63; }

  .sign-block{ display:flex; justify-content:center; margin-top:30px; }
  .sign-box{ text-align:center; width:240px; margin:0 auto; }
  .sign-box .place-date{ margin-bottom:4px; }
  .sign-box .sig-img{ display:block; height:100px; margin:0 auto -18px; }
  .sign-box .sig-blank{ display:block; height:75px; }
  .sign-box .name{ font-weight:700; text-decoration:underline; }
  .sign-box .role{ font-size:12px; }

  .form-title{ text-align:center; font-weight:700; font-family:'Times New Roman', Times, serif; margin-bottom:2px; font-size:15px; }
  .form-sub{ text-align:center; font-size:12px; color:#333; font-family:'Times New Roman', Times, serif; margin-bottom:14px; line-height:1.4; }

  .form-sheet{ max-width:1150px; font-size:12px; }

  .karyawan-info-v2{ display:grid; grid-template-columns:1fr 1fr; gap:2px 30px; font-size:12px; margin-bottom:14px; font-family:'Times New Roman', Times, serif; }
  .karyawan-info-v2 .col div{ display:flex; margin-bottom:1px; }
  .karyawan-info-v2 .l{ width:230px; flex-shrink:0; }

  table.kriteria-print-v2{ width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:14px; font-family:'Times New Roman', Times, serif; }
  table.kriteria-print-v2 th, table.kriteria-print-v2 td{ border:1px solid #333; padding:4px 7px; vertical-align:top; }
  table.kriteria-print-v2 th{ background:#f0f0f0; text-align:center; }
  table.kriteria-print-v2 td.roman{ width:24px; text-align:center; font-weight:700; vertical-align:middle; }
  table.kriteria-print-v2 td.skor{ width:60px; text-align:center; font-weight:700; }
  table.kriteria-print-v2 td.kategori-cell{ font-weight:700; background:#f7f4ee; }
  table.kriteria-print-v2 tr.rata td{ font-style:italic; font-weight:700; background:#fbf6ea; }
  table.kriteria-print-v2 tr.total-row td{ font-weight:700; background:#f0f0f0; text-align:center; }
  table.kriteria-print-v2 td.saran-cell{ width:280px; }
  .saran-label{ font-weight:700; }
  .saran-text{ min-height:34px; white-space:pre-wrap; }

  .bottom-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 30px; margin-bottom:10px; }
  .catatan-box .l{ font-weight:700; margin-bottom:4px; }
  .catatan-box .catatan-text{ min-height:90px; white-space:pre-wrap; font-size:12px; }

  .rekom-check-list{ font-family:'Times New Roman', Times, serif; font-size:12px; }
  .rekom-check-list .row{ margin-bottom:6px; }

  .sign-row-4{ display:flex; justify-content:space-between; margin-top:36px; font-family:'Times New Roman', Times, serif; font-size:12px; text-align:center; }
  .sign-row-4 .box{ width:23%; }
  .sign-row-4 .box .sig-img{ display:block; height:50px; margin:35px auto -8px; }
  .sign-row-4 .box .name{ margin-top:45px; border-top:1px solid #333; padding-top:4px; }
  .sign-row-4 .box .name.has-sig{ margin-top:0; }
  .sign-row-4 .box .role{ margin-top:4px; }

  .note-box{ font-family:'Times New Roman', Times, serif; font-size:11px; margin-top:22px; }
  .note-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2px 30px; margin-top:6px; }

  @page { size: A4; margin: 3mm; }
  @page formpage { size: A4 landscape; margin: 3mm; }
  .form-sheet{ page: formpage; }

  @media print {
    @page{ margin:3mm; }
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .sheet{ box-shadow:none; margin:0 auto; page-break-after:always; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <a class="back" href="kontrak.html">← Kembali ke daftar memo</a>
    <button class="btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button>
  </div>

  <div id="content">
    <div class="sheet"><p style="font-family:'Times New Roman', Times, serif;">Memuat data...</p></div>
  </div>

<script>
const REKOMENDASI_LABELS = {
  lulus_percobaan: 'Lulus Masa Percobaan',
  tidak_lulus_percobaan: 'Tidak Lulus Masa Percobaan',
  diperpanjang: 'Kontrak Diperpanjang',
  tidak_diperpanjang: 'Tidak Diperpanjang Kontrak',
  lulus_akting: 'Lulus Masa Akting',
  tidak_lulus_akting: 'Tidak Lulus Masa Akting',
  karyawan_tetap: 'Diangkat Menjadi Karyawan Tetap'
};

const FORM_KRITERIA = {
  FORM1: {
    title: 'Form 1',
    sub: 'Karyawan memiliki anak buah',
    sections: [
      { kategori: 'I. Sikap', items: ['Tanggung Jawab pekerjaan','Kemampuan pengendalian diri','Semangat dalam bekerja','Kemauan belajar hal baru','Disiplin'] },
      { kategori: 'II. Penguasaan Pekerjaan', items: ['Kemampuan Teknikal','Pengetahuan Teknikal'] },
      { kategori: 'III. People Management', items: ['Mengembangkan orang lain','Coaching and Counseling','Delegasi','Kerjasama team'] }
    ]
  },
  FORM2: {
    title: 'Form 2',
    sub: 'Karyawan tidak memiliki anak buah',
    sections: [
      { kategori: 'I. Sikap', items: ['Tanggung Jawab pekerjaan','Kemampuan pengendalian diri','Semangat dalam bekerja','Kemauan belajar hal baru','Disiplin'] },
      { kategori: 'II. Penguasaan Pekerjaan', items: ['Kemampuan Teknikal','Pengetahuan Teknikal'] }
    ]
  }
};

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

function fmtDate(d, opt) {
  if (!d) return '-';
  return new Date(d).toLocaleDateString('id-ID', opt || { day:'numeric', month:'long', year:'numeric' });
}
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}
function cb(checked) { return `<span class="checkbox${checked ? ' checked' : ''}"></span>`; }
function b(checked, text) { return checked ? `<b>${text}</b>` : text; }

const ROMAN = ['I','II','III','IV','V'];

function buildSaranContent(k) {
  return `
    <div class="saran-label">Kekuatan :</div>
    <div class="saran-text">${k.kekuatan ? esc(k.kekuatan) : ''}</div>
    <div class="saran-label" style="margin-top:16px;">Area Pengembangan :</div>
    <div class="saran-text">${k.area_pengembangan ? esc(k.area_pengembangan) : ''}</div>
  `;
}

function buildKriteriaSaranTable(k, tpl, skorMap) {
  const totalRows = tpl.sections.reduce((sum, sec) => sum + sec.items.length + 2, 0) + 1;
  let rowsHtml = '';
  let firstRow = true;
  const sectionAverages = [];

  tpl.sections.forEach((sec, secIdx) => {
    const roman = ROMAN[secIdx] || String(secIdx + 1);
    const rowSpanForSection = sec.items.length + 2;
    const catName = sec.kategori.replace(/^[IVX]+\.\s*/, '');

    rowsHtml += `<tr>
      <td class="roman" rowspan="${rowSpanForSection}">${roman}</td>
      <td colspan="2" class="kategori-cell">${esc(catName)}</td>
      ${firstRow ? `<td class="saran-cell" rowspan="${totalRows}">${buildSaranContent(k)}</td>` : ''}
    </tr>`;
    firstRow = false;

    const scores = [];
    sec.items.forEach((label, i) => {
      const skor = skorMap[`${sec.kategori}||${label}`];
      if (skor != null) scores.push(skor);
      rowsHtml += `<tr><td colspan="2">${String.fromCharCode(97 + i)}. ${esc(label)}</td><td class="skor">${skor ?? ''}</td></tr>`;
    });
    const avg = scores.length ? (scores.reduce((a, bb) => a + bb, 0) / scores.length) : null;
    if (avg != null) sectionAverages.push(avg);
    rowsHtml += `<tr class="rata"><td colspan="2">Rata-rata</td><td class="skor">${avg != null ? avg.toFixed(2) : ''}</td></tr>`;
  });

  const total = sectionAverages.length ? (sectionAverages.reduce((a, bb) => a + bb, 0) / sectionAverages.length).toFixed(2) : '-';
  rowsHtml += `<tr class="total-row"><td colspan="3">TOTAL RATA-RATA</td><td class="skor">${total}</td></tr>`;

  return `
    <table class="kriteria-print-v2">
      <tr><th colspan="2">KRITERIA EVALUASI</th><th>Penilaian</th><th>SARAN DAN PENGEMBANGAN</th></tr>
      ${rowsHtml}
    </table>
  `;
}

async function load() {
  if (!id) { renderError('Parameter id tidak ditemukan.'); return; }

  const { data, error } = await supabaseClient.from('im_kontrak').select('*').eq('id', id).single();
  if (error || !data) { renderError('Data memo tidak ditemukan.'); return; }

  const { data: approvals } = await supabaseClient
    .from('im_kontrak_approval')
    .select('*')
    .eq('kontrak_id', id);

  const hcsRow = (approvals || []).find(a => a.tahap === 'hcs');
  const penilaiRow = (approvals || []).find(a => a.tahap === 'penilai');
  data.hcs_penandatangan_nama = hcsRow ? hcsRow.approver_nama : '';
  data.hcs_signature_data = hcsRow ? hcsRow.signature_data : '';
  data.penilai_signature_data = penilaiRow ? penilaiRow.signature_data : '';

  render(data);
}


function renderError(msg) {
  document.getElementById('content').innerHTML = `<div class="sheet"><p style="font-family:'Times New Roman', Times, serif;">${esc(msg)}</p></div>`;
}

function render(k) {
  // Hanya tampilkan 3 riwayat kontrak terakhir.
  const riwayat = (Array.isArray(k.riwayat_kontrak) ? k.riwayat_kontrak : []).slice(-3);
  const riwayatRows = riwayat.map(r => `
    <tr>
      <th>Kontrak ke ${r.ke ?? '-'}</th>
      <td>${fmtDate(r.mulai, {day:'2-digit',month:'2-digit',year:'numeric'})} — ${fmtDate(r.selesai, {day:'2-digit',month:'2-digit',year:'numeric'})}</td>
    </tr>
  `).join('');

  // Baris kontrak selanjutnya (yang sedang diajukan/dinilai) — dikosongkan untuk diisi manual setelah keputusan.
  const nextKe = (k.kontrak_ke_terakhir != null ? k.kontrak_ke_terakhir : riwayat.length) + 1;
  const nextRow = `<tr><th>Kontrak ke ${nextKe}</th><td><span class="blank-line">&nbsp;</span></td></tr>`;

  const rekom = k.rekomendasi;
  const memoBody = `
    <div class="sheet">
      <div class="letterhead">
        <div class="logo-mark"><img src="images/logo-sda-global.png" alt="Logo"></div>
      </div>

      <div class="memo-title">INTERNAL MEMO</div>
      <div class="memo-number">${esc(k.nomor_memo || '—/A.01/HRD/—/—')}</div>

      <div class="memo-meta">
        <table>
          <tr><td class="k">Kepada</td><td><span class="colon-space">:</span>${esc(k.kepada_jabatan || '-')}${k.kepada_nama ? '<br><span class="colon-space"></span>Up. ' + esc(k.kepada_nama) : ''}</td></tr>
          <tr><td class="k">Dari</td><td>: ${esc(k.dari || 'Dept. HCS')}</td></tr>
          <tr><td class="k">Perihal</td><td>: Masa Berakhirnya Kontrak Kerja</td></tr>
        </table>
      </div>

      <div class="memo-body">
        <p>Dengan hormat,</p>
        <p>Dengan ini kami informasikan, bahwa berdasarkan data perjanjian kerja karyawan yang tersebut di bawah ini telah berakhir masa perjanjian kontraknya:</p>
      </div>

      <table class="info-table">
        <tr><th>Nama</th><td>${esc(k.nama_snapshot)}</td></tr>
        <tr><th>Unit</th><td>${esc(k.unit_snapshot || '-')}</td></tr>
        <tr><th>Bagian</th><td>${esc(k.jabatan_snapshot || '-')}</td></tr>
        <tr><th>Tanggal Masuk</th><td>${fmtDate(k.tanggal_masuk, {day:'2-digit',month:'2-digit',year:'numeric'})}</td></tr>
        ${riwayatRows}
        ${nextRow}
      </table>

      <div class="memo-body">
        <p>Untuk selanjutnya apabila ${b(rekom==='diperpanjang','diperpanjang')} ( ${b(k.durasi_perpanjangan==='3','3')} / ${b(k.durasi_perpanjangan==='6','6')} / ${b(k.durasi_perpanjangan==='12','12')} bulan ) / ${b(rekom==='tidak_diperpanjang','Tidak diperpanjang')} / ${b(rekom==='karyawan_tetap','Diusulkan sebagai karyawan tetap')}, dilengkapi dengan pengisian form sebagaimana terlampir. Balasan internal memo maksimal 30 hari sebelum kontrak karyawan berakhir, jika melebihi batas waktu yang telah ditetapkan maka hal - hal yang berkaitan dengan legalitas karyawan (status kekaryawanan) menjadi tanggungan Departemen.</p>
        <p>Demikian pemberitahuan dari kami atas perhatian dan kerjasamanya kami sampaikan terima kasih.</p>
      </div>

      <div class="sign-block">
        <div class="sign-box">
          <div class="place-date">Surabaya, ${fmtDate(k.tanggal_memo)}<br>Hormat Saya,</div>
          ${k.hcs_signature_data ? `<img class="sig-img" src="${k.hcs_signature_data}" alt="Tanda tangan">` : `<span class="sig-blank"></span>`}
          <div class="name">${esc(k.hcs_penandatangan_nama || '____________________')}</div>
          <div class="role">HCS Supervisor</div>
        </div>
      </div>
    </div>
  `;

  const tpl = FORM_KRITERIA[k.tipe_form] || FORM_KRITERIA.FORM2;
  const skorMap = {};
  (Array.isArray(k.skor_detail) ? k.skor_detail : []).forEach(s => { skorMap[`${s.kategori}||${s.label}`] = s.skor; });

  const kriteriaSaranTable = buildKriteriaSaranTable(k, tpl, skorMap);

  const formBody = `
    <div class="sheet form-sheet">
      <div class="form-title">FORMULIR PENILAIAN KARYAWAN</div>
      <div class="form-sub">${esc(tpl.title)}<br>${esc(tpl.sub)}</div>

      <div class="karyawan-info-v2">
        <div class="col">
          <div><span class="l">Nama</span>: ${esc(k.nama_snapshot)}</div>
          <div><span class="l">NIK</span>: ${esc(k.nik_snapshot)}</div>
          <div><span class="l">Jabatan</span>: ${esc(k.jabatan_snapshot || '-')}</div>
        </div>
        <div class="col">
          <div><span class="l">Departemen</span>: ${esc(k.bagian_snapshot || '-')}</div>
          <div><span class="l">Tanggal Masuk</span>: ${fmtDate(k.tanggal_masuk, {day:'2-digit',month:'2-digit',year:'numeric'})}</div>
          <div><span class="l">Masa Akhir Akting / Percobaan / Kontrak</span>: ${fmtDate(k.masa_akhir_kontrak, {day:'2-digit',month:'2-digit',year:'numeric'})}</div>
          <div><span class="l">Nama Atasan</span>: ${esc(k.nama_atasan_penilai || '-')}</div>
        </div>
      </div>

      ${kriteriaSaranTable}

      <div class="bottom-grid">
        <div class="rekom-check-list">
          <div style="font-weight:700; margin-bottom:6px;">Rekomendasi dari Atasan ** :<br><span style="font-weight:400; font-size:11px;">(Berikan &radic; rekomendasi di bawah ini)</span></div>
          <div class="row">${cb(rekom==='lulus_percobaan' || rekom==='tidak_lulus_percobaan')} ${b(rekom==='lulus_percobaan','Lulus')} / ${b(rekom==='tidak_lulus_percobaan','Tidak Lulus')} Masa Percobaan</div>
          <div class="row">${cb(rekom==='diperpanjang' || rekom==='tidak_diperpanjang')} ${b(rekom==='diperpanjang','Perpanjang' + (rekom==='diperpanjang' && k.durasi_perpanjangan ? ' (' + k.durasi_perpanjangan + ' bulan)' : ''))}/ ${b(rekom==='tidak_diperpanjang','Tidak Diperpanjang')} Kontrak</div>
          <div class="row">${cb(rekom==='lulus_akting' || rekom==='tidak_lulus_akting')} ${b(rekom==='lulus_akting','Lulus')}/ Perpanjang/ ${b(rekom==='tidak_lulus_akting','Tidak Lulus')} Masa Akting</div>
          <div class="row">${cb(rekom==='karyawan_tetap')} ${b(rekom==='karyawan_tetap','Karyawan Tetap')}</div>
        </div>
        <div class="catatan-box">
          <div class="l">Catatan</div>
          <div class="catatan-text">${k.catatan_penilai ? esc(k.catatan_penilai) : ''}</div>
        </div>
      </div>

      <div style="font-family:'Times New Roman', Times, serif; font-size:12px; margin-top:20px;">Surabaya, ${fmtDate(k.tanggal_memo)}</div>

      <div class="sign-row-4">
        <div class="box">
          Diajukan oleh,
          ${k.penilai_signature_data ? `<img class="sig-img" src="${k.penilai_signature_data}" alt="Tanda tangan">` : ''}
          <div class="name${k.penilai_signature_data ? ' has-sig' : ''}">${esc(k.nama_atasan_penilai || '')}</div>
          <div class="role">( Atasan Langsung )</div>
        </div>
        <div class="box">
          Disetujui oleh,
          <div class="name">&nbsp;</div>
          <div class="role">( Atasan Tidak Langsung )</div>
        </div>
        <div class="box">
          &nbsp;
          <div class="name">&nbsp;</div>
          <div class="role">( PDV and Recruitment )</div>
        </div>
        <div class="box">
          Diketahui oleh,
          ${k.hcs_signature_data ? `<img class="sig-img" src="${k.hcs_signature_data}" alt="Tanda tangan">` : ''}
          <div class="name${k.hcs_signature_data ? ' has-sig' : ''}">${esc(k.hcs_penandatangan_nama || '')}</div>
          <div class="role">( Manajer / Direktur HCS )</div>
        </div>
      </div>

      <div class="note-box">
        <b>NOTE :</b>
        <div class="note-grid">
          <div>
            <div>* Score Criteria : 1 to 5</div>
            <div>1 = Sangat Kurang</div>
            <div>2 = Kurang</div>
            <div>3 = Cukup</div>
            <div>4 = Bagus</div>
            <div>5 = Sangat bagus</div>
          </div>
          <div>
            <div>** Kriteria penilaian selama percobaan tidak boleh dibawah 3</div>
            <div>1. Sikap Kerja</div>
            <div>2. Penguasaan Pekerjaan</div>
          </div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('content').innerHTML = memoBody + formBody;
}

load();
</script>
</body>
</html>
