<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Form Penilaian Kinerja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<style>
  :root{ --bg:#241a12; --muted:#b6a48c; --text:#f2e9dc; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); font-family:'Segoe UI',system-ui,sans-serif; color:var(--text); padding:24px 16px 80px; }
  .toolbar{ max-width:1100px; margin:0 auto 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .back{ color:var(--muted); text-decoration:none; font-size:13px; }
  .tools{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted); }
  .btn{ background:linear-gradient(135deg,#e0a94f,#c78a32); color:#241a12; border:none; padding:10px 18px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .err{ max-width:800px; margin:40px auto; text-align:center; color:var(--muted); }

  .sheet{ background:#fff; color:#000; width:1100px; max-width:100%; margin:0 auto; padding:18px 26px 20px; font-family:Verdana,Tahoma,'Segoe UI',sans-serif; font-size:11px; line-height:1.3; border-radius:4px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  .title{ text-align:center; line-height:1.35; margin-bottom:14px; }
  .title .b{ font-weight:700; }
  table{ border-collapse:collapse; }
  .info{ width:100%; margin-bottom:10px; }
  .info td{ padding:1px 0; vertical-align:top; }
  .info .k{ width:70px; } .info .c{ width:16px; } .info .v{ width:34%; }
  .info .k2{ width:120px; } .info .c2{ width:16px; }

  table.main{ width:100%; border:1px solid #000; table-layout:fixed; }
  table.main th, table.main td{ padding:1px 5px; vertical-align:top; }
  table.main th{ border:1px solid #000; font-weight:700; text-align:center; }
  table.main td{ border-left:1px solid #000; border-right:1px solid #000; }
  col.c1{ width:8%; } col.c2{ width:32%; } col.c3{ width:9%; } col.c4{ width:51%; }
  td.rom{ text-align:center; }
  tr.sec td{ border-top:1px solid #000; border-bottom:1px solid #000; }
  tr.sec td.nm{ font-weight:700; }
  td.sk{ border:1px solid #000 !important; height:15px; text-align:center; padding:0 !important; }
  tr.rata td.lb{ text-align:right; font-weight:700; font-style:italic; padding-right:34px; }
  tr.rata td.sk, tr.total td.sk{ border:2px solid #000 !important; font-weight:700; }
  td.sl{ text-align:center; }
  td.sbody{ white-space:pre-wrap; font-size:10.5px; }
  tr.total td{ border:1px solid #000; font-weight:700; text-align:center; }
  tr.total td.sk{ border:2px solid #000; }

  .catatan{ margin:14px 0 0 40%; width:60%; border:1px solid #000; height:96px; padding:3px 5px; white-space:pre-wrap; }
  .catatan.full{ }

  .tgl{ margin:10px 0 6px 8%; }
  .ttd{ width:100%; table-layout:fixed; margin-left:0; }
  .ttd td{ vertical-align:top; padding:0 6px 0 0; }
  .ttd td.first{ width:8%; }
  .ttd .space{ height:46px; }
  .ttd .nama{ display:flex; justify-content:space-between; width:80%; }
  .ttd .nama span:nth-child(2){ flex:1; text-align:center; }
  .note{ margin-top:10px; margin-left:8%; font-size:11px; }
  .note b{ display:block; }
  .note .star{ position:absolute; margin-left:-22px; }
  .note div.l{ margin-left:0; }

  @media print{
    @page{ size:A4 landscape; margin:8mm; }
    body{ background:#fff; padding:0; }
    .toolbar{ display:none; }
    .sheet{ box-shadow:none; width:100%; padding:0; border-radius:0; }
  }
</style>
</head>
<body>
<div class="toolbar">
  <a class="back" href="penilaian.html">← Kembali ke daftar penilaian</a>
  <div class="tools">
    <label><input type="checkbox" id="chkNilai"> Cetak dengan nilai yang tersimpan</label>
    <button class="btn" onclick="window.print()">🖨 Cetak / Simpan PDF</button>
  </div>
</div>
<div id="root"><div class="err">Memuat form...</div></div>

<script>
const FORM_TEMPLATES = {
  C: {
    label: 'Form C',
    sections: [
      { kategori: 'I - Sikap', items: [
        {kode:'a', label:'Tanggung jawab pada pekerjaan'},
        {kode:'b', label:'Kemampuan mengendalikan diri'},
        {kode:'c', label:'Semangat kerja'},
        {kode:'d', label:'Kemauan untuk belajar hal baru'},
        {kode:'e', label:'Disiplin'}
      ]},
      { kategori: 'II - Penguasaan Pekerjaan', items: [
        {kode:'a', label:'Kemampuan / skill'},
        {kode:'b', label:'Pengetahuan teknis'}
      ]},
      { kategori: 'III - People Management', items: [
        {kode:'a', label:'Mengembangkan orang lain'},
        {kode:'b', label:'Coaching and Counseling'},
        {kode:'c', label:'Delegasi'},
        {kode:'d', label:'Kerjasama team'}
      ]}
    ],
    showSaran: true,
    approvalLabels: ['Atasan Langsung','Atasan satu tingkat diatas atasan langsung','Atasan Dua tingkat diatas atasan langsung','HCS Unit'],
    signRowLabels: ['Dinilai oleh','Disetujui','Diketahui','Diterima']
  },
  B: {
    label: 'Form B',
    sections: [
      { kategori: 'I - Sikap', items: [
        {kode:'a', label:'Tanggung jawab pada pekerjaan'},
        {kode:'b', label:'Kemampuan mengendalikan diri'},
        {kode:'c', label:'Semangat kerja'},
        {kode:'d', label:'Kemauan untuk belajar hal baru'},
        {kode:'e', label:'Disiplin'}
      ]},
      { kategori: 'II - Penguasaan Pekerjaan', items: [
        {kode:'a', label:'Kemampuan / skill'},
        {kode:'b', label:'Pengetahuan teknis'}
      ]}
    ],
    showSaran: true,
    approvalLabels: ['SPV','Atasan langsung SPV','Atasan tidak langsung SPV','HCS Unit'],
    signRowLabels: ['Dinilai oleh','Disetujui','Diketahui','Diterima']
  },
  WORKER: {
    label: 'Form Worker',
    sections: [
      { kategori: 'Penilaian Kinerja', items: [
        {kode:'a', label:'Pencapaian hasil kerja'},
        {kode:'b', label:'Kualitas hasil pekerjaan'},
        {kode:'c', label:'Sikap bekerja'},
        {kode:'d', label:'Disiplin / absensi'},
        {kode:'e', label:'Potensi dikembangkan'}
      ]}
    ],
    showSaran: false,
    approvalLabels: ['SPV','Atasan langsung SPV','Atasan Tidak langsung SPV','HCS Unit'],
    signRowLabels: ['Penilai','Disetujui','Diketahui','Diterima']
  }
};

const FORM_DESC = {
  C: 'Karyawan memiliki anak buah',
  B: 'Karyawan tidak memiliki anak buah',
  WORKER: 'Worker, Helper, Driver, Security, OB, CS, Tukang'
};
const SARAN_LABELS = ['Kekuatan','Area pengembangan'];
const APPROVAL_STAGES = ['pimpinan_langsung','pimpinan_tidak_langsung','atasan_lebih_tinggi','hcs'];
let DATA = null;

function esc(v){ const d=document.createElement('div'); d.textContent = v==null?'':String(v); return d.innerHTML; }

async function load(){
  const root = document.getElementById('root');
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { root.innerHTML = '<div class="err">ID penilaian tidak ditemukan.</div>'; return; }
  const [p, d, a] = await Promise.all([
    supabaseClient.from('penilaian_karyawan').select('*').eq('id', id).single(),
    supabaseClient.from('penilaian_detail').select('*').eq('penilaian_id', id),
    supabaseClient.from('penilaian_approval').select('*, approver:master_karyawan(nama)').eq('penilaian_id', id).order('urutan', { ascending: true })
  ]);
  if (p.error || !p.data) { root.innerHTML = '<div class="err">Data penilaian tidak ditemukan.</div>'; return; }
  DATA = { p: p.data, detail: d.data || [], approvals: a.data || [] };
  render();
}

function render(){
  const { p, detail, approvals } = DATA;
  const tipe = FORM_TEMPLATES[p.tipe_form] ? p.tipe_form : 'B';
  const tpl = FORM_TEMPLATES[tipe];
  const withScore = document.getElementById('chkNilai').checked;
  const skor = {};
  detail.forEach(x => { skor[x.kategori + '|' + x.kode] = x.skor; });
  const saran = tpl.showSaran;
  const sarGet = [p.saran_kekuatan, p.saran_pengembangan];

  let rows = '';
  tpl.sections.forEach((sec, si) => {
    const m = sec.kategori.match(/^([IVX]+)\s*-\s*(.*)$/);
    const rom = m ? m[1] : '', nm = m ? m[2] : sec.kategori;
    const n = sec.items.length;
    const vals = [];
    const hasSaranLabel = saran && si < SARAN_LABELS.length;
    rows += `<tr class="sec"><td class="rom">${esc(rom)}</td><td class="nm">${esc(nm)}</td><td class="sk"></td>` +
      (saran ? `<td class="sl">${hasSaranLabel ? SARAN_LABELS[si] : ''}</td>` : '') + `</tr>`;
    sec.items.forEach((it, ii) => {
      const v = withScore ? skor[sec.kategori + '|' + it.kode] : null;
      if (v != null) vals.push(Number(v));
      rows += `<tr><td></td><td>${esc(it.kode)}. ${esc(it.label)}</td><td class="sk">${v != null ? esc(v) : ''}</td>` +
        (saran && ii === 0 ? `<td class="sbody" rowspan="${n + 1}">${withScore && hasSaranLabel ? esc(sarGet[si]) : ''}</td>` : '') + `</tr>`;
    });
    const avg = vals.length ? (vals.reduce((x,y)=>x+y,0)/vals.length).toFixed(2) : '';
    rows += `<tr class="rata"><td></td><td class="lb">Rata-rata</td><td class="sk">${avg}</td></tr>`;
  });
  const total = withScore && p.total_rata_rata != null ? Number(p.total_rata_rata).toFixed(2) : '';
  rows += `<tr class="total"><td colspan="2">Total rata-rata</td><td class="sk">${total}</td>${saran ? '<td style="border-left:1px solid #000;border-right:none"></td>' : ''}</tr>`;

  const head = `<tr><th colspan="2">Kriteria Penilaian</th><th>Penilai<br>Atasan</th>${saran ? '<th>Saran dan pengembangan</th>' : ''}</tr>`;
  const cols = saran ? '<col class="c1"><col class="c2"><col class="c3"><col class="c4">' : '<col style="width:10%"><col style="width:75%"><col style="width:15%">';

  const catatan = saran ? `<div class="catatan">Catatan atasan${withScore && p.catatan_atasan ? '<br>' + esc(p.catatan_atasan) : ''}</div>` : '';

  const ttdHead = ['Dinilai oleh', 'Disetujui,', 'Diketahui,', 'Diterima,'];
  if (tpl.signRowLabels[0] === 'Penilai') ttdHead[0] = 'Penilai';
  const ttd = tpl.approvalLabels.map((label, i) => {
    const ap = approvals.find(x => x.urutan === i + 1 || x.tahap === APPROVAL_STAGES[i]);
    const nama = ap && ap.approver ? esc(ap.approver.nama) : '';
    return `<td>${ttdHead[i]}<div class="space"></div><div class="nama"><span>(</span><span>${nama}</span><span>)</span></div>${esc(label)}</td>`;
  }).join('');

  const tglMasuk = p.tgl_masuk_kerja ? new Date(p.tgl_masuk_kerja).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) : '';
  const worker = tipe === 'WORKER';

  document.getElementById('root').innerHTML = `
  <div class="sheet">
    <div class="title"><div class="b">Penilaian Kinerja ${esc(p.periode)}</div><div class="b">Form PA</div><div>${esc(tpl.label)}</div><div>${esc(FORM_DESC[tipe])}</div></div>
    <table class="info">
      <tr><td class="k">Nama</td><td class="c">:</td><td class="v">${esc(p.nama_snapshot)}</td><td class="k2">Department</td><td class="c2">:</td><td>${esc(p.departemen_snapshot)}</td></tr>
      <tr><td class="k">NIK</td><td class="c">:</td><td class="v">${esc(p.nik_snapshot)}</td><td class="k2">Sub. Departement</td><td class="c2">:</td><td>${esc(p.sub_departemen_snapshot)}</td></tr>
      <tr><td class="k">Jabatan</td><td class="c">:</td><td class="v">${esc(p.jabatan_snapshot)}</td><td class="k2">Unit</td><td class="c2">:</td><td>${esc(p.unit_snapshot)}</td></tr>
      <tr><td class="k">Level</td><td class="c">:</td><td class="v">${esc(p.level_snapshot)}</td>${worker ? `<td class="k2">Tanggal Masuk</td><td class="c2">:</td><td>${esc(tglMasuk)}</td>` : '<td colspan="3"></td>'}</tr>
    </table>
    <table class="main"><colgroup>${cols}</colgroup>${head}${rows}</table>
    ${catatan}
    <div class="tgl">Surabaya, ..................................................</div>
    <table class="ttd"><tr><td class="first"></td>${ttd}</tr></table>
    <div class="note"><b>NOTE :</b>
      <div class="l">* &nbsp;Skala penilaian : 1- 5</div>
      <div>1 = Sangat Kurang &nbsp;&nbsp; 2 = Kurang &nbsp;&nbsp; 3 = Cukup &nbsp;&nbsp; 4 = Bagus &nbsp;&nbsp; 5 = Sangat bagus</div>
    </div>
  </div>`;
}

document.getElementById('chkNilai').addEventListener('change', () => { if (DATA) render(); });
const currentUser = JSON.parse(sessionStorage.getItem('user') || 'null');
if (!currentUser) window.location.href = 'login.html'; else load();
</script>
</body>
</html>
